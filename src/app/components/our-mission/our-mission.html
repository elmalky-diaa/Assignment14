<section class="relative py-24 overflow-hidden">
  <div class="absolute inset-0 bg-[#0a0a0a]"></div>
  <div
    class="absolute inset-0 bg-[linear-gradient(rgba(38,38,38,0.5)_1px,transparent_1px),linear-gradient(90deg,rgba(38,38,38,0.5)_1px,transparent_1px)] bg-size-[60px_60px]"
  ></div>
  <div class="absolute inset-0 opacity-30">
    <div class="absolute top-20 left-20 w-72 h-72 bg-orange-500/20 rounded-full blur-[100px]"></div>
    <div
      class="absolute bottom-20 right-20 w-96 h-96 bg-yellow-500/10 rounded-full blur-[120px]"
    ></div>
  </div>
  <div class="relative max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <app-title-main>
      <span class="text-sm font-medium text-neutral-300">من نحن</span>
    </app-title-main>
    <app-section-title> مهمتنا هي الإعلام والإلهام</app-section-title>
    <p class="text-xl text-neutral-400 max-w-3xl mx-auto leading-relaxed mb-12">
      مدونة متخصصة في فن التصوير الفوتوغرافي، نشارك معكم أسرار المحترفين ونصائح عملية لتطوير
      مهاراتكم. نحن شغوفون بمشاركة المعرفة ومساعدة المصورين على تنمية مهاراتهم من خلال محتوى عالي
      الجودة.
    </p>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto">
      @for (rank of ranks; track $index) {
        <app-card-small [rank]="rank"></app-card-small>
      }
    </div>
  </div>
</section>
