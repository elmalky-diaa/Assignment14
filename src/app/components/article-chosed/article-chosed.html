<section class="py-24 bg-[#0a0a0a] relative overflow-hidden">
  <div
    class="absolute top-0 right-0 w-1/3 h-full bg-linear-to-l from-orange-500/5 to-transparent"
  ></div>
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-4">
      <div>
        <app-title-main>
          <span class="text-sm font-medium text-neutral-300">مميز </span>
        </app-title-main>
        <app-section-title>مقالات مختارة</app-section-title>
        <app-section-subtitle>محتوى منتقى لبدء رحلة تعلمك</app-section-subtitle>
      </div>
      <a
        class="group inline-flex items-center gap-2 px-5 py-2.5 bg-linear-to-r from-orange-500 to-orange-600 text-white rounded-xl font-medium transition-all duration-300 hover:-translate-y-0.5"
        href="/blog"
        data-discover="true"
        >عرض الكل<svg
          class="w-4 h-4 group-hover:-translate-x-1 transition-transform rotate-180"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path></svg
      ></a>
    </div>
    <div class="space-y-8 gap-2">
      @for (post of postChosed.slice(0, 3); track $index) {
        <app-card-verctical [Posts]="post"></app-card-verctical>
      }
    </div>
  </div>
</section>
