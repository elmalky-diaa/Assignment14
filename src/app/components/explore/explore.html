<section class="py-24 bg-[#111111] relative border-y border-[#262626]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <app-title-main>
        <span class="text-sm font-medium text-neutral-300">التصنيفات</span>
      </app-title-main>
      <app-section-title>استكشف حسب الموضوع</app-section-title>
      <app-section-subtitle>اعثر على محتوى مصمم حسب اهتماماتك</app-section-subtitle>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
      @for (cat of Category; track $index) {
        <a
          class="group relative block p-6 rounded-2xl bg-[#161616] border border-[#262626] overflow-hidden hover:border-orange-500/30 transition-all duration-500 hover:-translate-y-1"
          href="/blog?category={{ cat.name }}"
          data-discover="true"
          style="animation-delay: 0ms"
          ><div
            class="absolute inset-0 bg-linear-to-br from-orange-500 to-yellow-500 opacity-0 group-hover:opacity-100 transition-opacity duration-500"
          ></div>
          <div class="relative z-10">
            <div
              class="w-12 h-12 bg-orange-500/10 rounded-xl flex items-center justify-center mb-4 group-hover:bg-white/20 transition-colors duration-300 border border-orange-500/20 group-hover:border-transparent"
            >
              <span
                class="text-xl text-orange-500 group-hover:text-white transition-colors duration-300"
              >
                <i [class]="cat.img"></i>
              </span>
            </div>
            <h3
              class="font-bold text-lg text-white group-hover:text-white transition-colors duration-300 mb-1"
            >
              {{ cat.name }}
            </h3>
            <p
              class="text-sm text-neutral-500 group-hover:text-white/80 transition-colors duration-300"
            >
              {{ cat.count }} مقالة
            </p>
            <div
              class="absolute top-6 left-6 w-8 h-8 rounded-full bg-[#262626] flex items-center justify-center opacity-0 group-hover:opacity-100 group-hover:bg-white/20 transition-all duration-300"
            >
              <svg
                class="w-4 h-4 text-white rotate-180"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                ></path>
              </svg>
            </div></div
        ></a>
      }
    </div>
  </div>
</section>
