<div
  class="text-center rounded-3xl bg-[#161616]/80 backdrop-blur-[20px] border border-[#262626] p-6 text-white hover:scale-105 transition-transform duration-300"
  style="animation-delay: 0ms"
>
  <span class="text-2xl text-orange-500 mb-1"><i [class]="rank.icon"></i></span>
  <p class="text-2xl md:text-3xl font-bold text-orange-500">{{ rank.data }}</p>
  <p class="text-neutral-500 text-sm">{{ rank.name }}</p>
</div>
